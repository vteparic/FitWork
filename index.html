<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitWork</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>FitWork</h1>
        <p>Track your workouts and keep your progress organized.</p>
    </header>

    <main>
        <section>
            <h2>New Workout</h2>

            <form id="workout-form">
                <label for="workout-date">Workout Date</label>
                <input type="date" id="workout-date" required>

                <label for="exercise">Exercise Name</label>
                <input type="text" id="exercise" placeholder="Example: Bench Press" required>

                <label for="sets">Sets</label>
                <input type="number" id="sets" min="1" required>

                <label for="reps">Reps</label>
                <input type="number" id="reps" min="1" required>

                <label for="weight">Weight (lbs)</label>
                <input type="number" id="weight" min="0" required>

                <button type="submit">Save Workout</button>
            </form>
        </section>

        <section>
            <h2>Workout History</h2>
            <div id="workout-history">
                <p>No workouts saved yet.</p>
            </div>
        </section>
    </main>

    <script src="workoutValidator.js"></script>
<script src="script.js"></script>

</body>
</html>
